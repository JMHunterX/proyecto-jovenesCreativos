<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CubeTrade | Tienda Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', }</script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-['Montserrat'] min-h-screen flex flex-col">

  <!-- Header -->
  <header
    class="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">CUBE<span
          class="text-red-600">TRADE</span></a>
      <nav class="hidden md:flex gap-8 font-medium">
        <a href="index.html" class="hover:text-red-600 transition">Inicio</a>
        <a href="tienda.html" class="text-red-600 dark:text-red-400">Tienda</a>
        <a href="trade.html" class="hover:text-red-600 transition">Zona Trade 🇨🇴</a>
        <a href="contacto.html" class="hover:text-red-600 transition">Contacto</a>
      </nav>
      <div class="flex items-center gap-4">
        <button id="themeToggle"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">🌓</button>
        <button id="openCartBtn"
          class="relative p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition"
          aria-label="Carrito de compras">
          🛒
          <span id="cartCount"
            class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center"
            style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Tienda -->
  <main class="flex-grow max-w-7xl mx-auto px-6 py-12">
    <div class="text-center max-w-2xl mx-auto mb-10">
      <h2 class="text-3xl font-bold mb-3">Catálogo Especializado</h2>
      <p class="text-gray-500 dark:text-gray-400 mb-6">Explora nuestra selección completa de cubos de velocidad,
        lubricantes y accesorios profesionales.</p>
      <!-- Buscador -->
      <input type="text" id="searchInput" placeholder="Busca por nombre de cubo (ej. RS3M, GAN, MGC)..."
        class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 px-5 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-600 shadow-sm">
    </div>

    <!-- Botones de Filtro por Categoría -->
    <div class="flex flex-wrap justify-center gap-2 mb-12">
      <button data-category="Todos"
        class="filter-btn bg-red-600 text-white px-5 py-2 rounded-full font-semibold text-sm transition">Todos</button>
      <button data-category="3x3"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">3x3</button>
      <button data-category="4x4"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">4x4</button>
      <button data-category="5x5"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">5x5</button>
      <button data-category="6x6"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">6x6</button>
      <button data-category="7x7"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">7x7</button>
      <button data-category="Megaminx"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Megaminx</button>
      <button data-category="Pyraminx"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Pyraminx</button>
      <button data-category="Skewb"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Skewb</button>
      <button data-category="Clock"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Clock</button>
      <button data-category="FTO"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Fto</button>
      <button data-category="Square-1"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Square-1</button>
      <button data-category="Lubricantes"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Lubricantes</button>
      <button data-category="Accesorios"
        class="filter-btn bg-gray-100 dark:bg-gray-800 hover:bg-red-600 hover:text-white px-5 py-2 rounded-full font-semibold text-sm transition">Accesorios</button>
    </div>

    <!-- Grid de Productos (Inyectado por JS) -->
    <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white text-center py-8 text-sm mt-16">
    <p>&copy; 2026 CubeTrade Colombia. Todos los derechos reservados.</p>
  </footer>

  <!-- Overlay oscuro de fondo -->
  <div id="cartOverlay" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"></div>

  <!-- Panel del Carrito -->
  <div id="cartDrawer"
    class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-gray-900 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <!-- Cabecera del Carrito -->
    <div class="p-6 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
      <h3 class="text-lg font-bold text-gray-900 dark:text-white">Tu Carrito de Compras</h3>
      <button id="closeCartBtn" class="text-gray-500 hover:text-red-600 text-xl font-bold">✕</button>
    </div>

    <!-- Lista de Productos en el Carrito -->
    <div id="cartItemsContainer" class="p-6 flex-1 overflow-y-auto space-y-4">
      <!-- Aquí se pintan los cubos que agregues -->
    </div>

    <!-- Resumen y Checkout -->
    <div class="p-6 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50">
      <div class="flex justify-between items-center mb-4">
        <span class="font-semibold text-gray-600 dark:text-gray-300">Total a Pagar:</span>
        <span id="cartTotal" class="text-xl font-extrabold text-red-600 dark:text-red-400">$ 0 COP</span>
      </div>
      <button id="checkoutBtn"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">Finalizar
        Compra por WhatsApp</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="productos.js"></script>
</body>

</html>
